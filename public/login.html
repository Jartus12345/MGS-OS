<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGS OS — Sign in</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0efe9;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border:0.5px solid rgba(0,0,0,0.12);border-radius:14px;padding:32px 36px;width:100%;max-width:360px}
.logo{font-size:14px;font-weight:700;letter-spacing:.04em;margin-bottom:4px}
.sub{font-size:11px;color:#9c9a92;margin-bottom:28px}
label{display:block;font-size:11px;font-weight:600;color:#5c5c58;margin-bottom:5px;letter-spacing:.04em;text-transform:uppercase}
input{width:100%;border:0.5px solid rgba(0,0,0,0.2);border-radius:8px;padding:9px 12px;font-size:13px;outline:none;background:#fff;margin-bottom:14px;font-family:inherit;transition:border .12s}
input:focus{border-color:#185FA5;box-shadow:0 0 0 3px rgba(24,95,165,0.1)}
.err{background:#FCEBEB;border:0.5px solid #F7C1C1;color:#791F1F;font-size:11px;padding:9px 12px;border-radius:8px;margin-bottom:14px}
button{width:100%;background:#1a1a18;color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .12s}
button:hover{opacity:.85}
</style>
</head>
<body>
<div class="card">
  <div class="logo">MGS OS</div>
  <div class="sub">Client delivery dashboard</div>
  <form method="POST" action="/login">
    <div id="err" style="display:none" class="err">Incorrect email or password. Please try again.</div>
    <label>Email</label>
    <input type="email" name="email" placeholder="you@manxgrowthsolutions.com" required autofocus>
    <label>Password</label>
    <input type="password" name="password" placeholder="••••••••" required>
    <button type="submit">Sign in</button>
  </form>
</div>
<script>
if(location.search.includes('error=1'))document.getElementById('err').style.display='block';
</script>
</body>
</html>
